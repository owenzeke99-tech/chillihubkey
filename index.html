<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chilli Hub Key</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#ff1744;
    --red2:#ff003c;
    --hot:#ff3158;
    --orange:#ff8a00;
    --yellow:#ffd54a;
    --black:#030305;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:"Orbitron",sans-serif;
    background:#030305;
    color:white;
}

/* =====================================================
   BACKGROUND
===================================================== */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,0,55,.16),
            transparent 30%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(255,23,68,.12),
            transparent 25%
        ),
        #030305;
    z-index:-20;
}

.grid{
    position:absolute;
    inset:-50%;
    width:200%;
    height:200%;
    background:
        linear-gradient(
            rgba(255,23,68,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,23,68,.055) 1px,
            transparent 1px
        );
    background-size:55px 55px;
    transform:perspective(500px) rotateX(65deg);
    animation:gridMove 10s linear infinite;
}

@keyframes gridMove{
    from{
        transform:
            perspective(500px)
            rotateX(65deg)
            translateY(0);
    }
    to{
        transform:
            perspective(500px)
            rotateX(65deg)
            translateY(55px);
    }
}

.vignette{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle,
            transparent 30%,
            rgba(0,0,0,.25) 65%,
            rgba(0,0,0,.88) 100%
        );
}

/* Background energy */
.energy{
    position:absolute;
    width:500px;
    height:500px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid rgba(255,23,68,.08);
    box-shadow:
        0 0 100px rgba(255,0,55,.08),
        inset 0 0 100px rgba(255,0,55,.05);
    animation:energyPulse 3s ease-in-out infinite;
}

.energy::before,
.energy::after{
    content:"";
    position:absolute;
    inset:35px;
    border-radius:50%;
    border:1px solid rgba(255,23,68,.07);
}

.energy::after{
    inset:80px;
}

@keyframes energyPulse{
    0%,100%{
        transform:translate(-50%,-50%) scale(.92);
        opacity:.5;
    }
    50%{
        transform:translate(-50%,-50%) scale(1.08);
        opacity:1;
    }
}

/* Glow blobs */
.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
}

.glow.one{
    width:350px;
    height:350px;
    left:-150px;
    top:-120px;
    background:#ff003c;
    opacity:.28;
    animation:blob1 7s ease-in-out infinite alternate;
}

.glow.two{
    width:320px;
    height:320px;
    right:-130px;
    bottom:-100px;
    background:#ff1744;
    opacity:.25;
    animation:blob2 8s ease-in-out infinite alternate;
}

@keyframes blob1{
    to{
        transform:translate(130px,100px) scale(1.3);
    }
}

@keyframes blob2{
    to{
        transform:translate(-120px,-100px) scale(1.25);
    }
}

/* =====================================================
   PARTICLES
===================================================== */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-5;
}

.particle{
    position:absolute;
    bottom:-20px;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#ff3158;
    box-shadow:
        0 0 7px #ff1744,
        0 0 16px #ff1744;
    animation:particleUp linear infinite;
}

@keyframes particleUp{
    0%{
        transform:translateY(0) scale(.2);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    80%{
        opacity:.9;
    }

    100%{
        transform:
            translateY(-115vh)
            translateX(70px)
            scale(1.5);
        opacity:0;
    }
}

/* =====================================================
   MAIN CARD
===================================================== */

.wrapper{
    width:min(92%,500px);
    position:relative;
    animation:cardIn 1s cubic-bezier(.16,1,.3,1);
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:
            translateY(40px)
            scale(.88);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.wrapper::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:31px;
    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            transparent 35deg,
            #ff1744 70deg,
            #ff003c 100deg,
            transparent 135deg,
            transparent 210deg,
            #ff3158 250deg,
            transparent 300deg,
            transparent 360deg
        );
    animation:borderSpin 4s linear infinite;
    z-index:-1;
    filter:
        blur(.5px)
        drop-shadow(0 0 18px rgba(255,23,68,.5));
}

@keyframes borderSpin{
    to{
        transform:rotate(360deg);
    }
}

.card{
    position:relative;
    padding:38px 32px 30px;
    border-radius:29px;
    background:
        linear-gradient(
            145deg,
            rgba(18,8,11,.92),
            rgba(5,5,8,.94)
        );
    border:1px solid rgba(255,255,255,.06);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    overflow:hidden;

    box-shadow:
        0 30px 100px rgba(0,0,0,.75),
        inset 0 0 60px rgba(255,0,55,.035);
}

/* Scan */
.card::before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    height:2px;
    top:-10%;
    background:
        linear-gradient(
            90deg,
            transparent,
            #ff1744,
            #ff8a00,
            #ff1744,
            transparent
        );
    box-shadow:
        0 0 15px #ff1744,
        0 0 30px #ff1744;
    opacity:.7;
    animation:scan 4s linear infinite;
}

@keyframes scan{
    from{top:-10%}
    to{top:110%}
}

/* =====================================================
   FLAME LOGO
===================================================== */

.logo-area{
    width:155px;
    height:155px;
    margin:0 auto 18px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Rotating rings */
.ring{
    position:absolute;
    border-radius:50%;
}

.ring.one{
    inset:5px;
    border:
        1px solid rgba(255,23,68,.45);
    border-top-color:#ff1744;
    border-right-color:#ff8a00;
    animation:rotate 4s linear infinite;
}

.ring.two{
    inset:16px;
    border:
        1px dashed rgba(255,82,109,.35);
    animation:rotateReverse 6s linear infinite;
}

.ring.three{
    inset:28px;
    border:
        1px solid rgba(255,23,68,.2);
    box-shadow:
        0 0 25px rgba(255,23,68,.15),
        inset 0 0 25px rgba(255,23,68,.12);
    animation:ringPulse 2s ease-in-out infinite;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateReverse{
    to{
        transform:rotate(-360deg);
    }
}

@keyframes ringPulse{
    50%{
        transform:scale(1.08);
        box-shadow:
            0 0 45px rgba(255,23,68,.3),
            inset 0 0 35px rgba(255,23,68,.2);
    }
}

/* Flame glow */
.flame-glow{
    position:absolute;
    width:85px;
    height:85px;
    border-radius:50%;
    background:#ff1744;
    filter:blur(35px);
    opacity:.38;
    animation:flameGlow 1.3s ease-in-out infinite alternate;
}

@keyframes flameGlow{
    to{
        transform:scale(1.35);
        opacity:.6;
    }
}

/* Main flame */
.flame{
    position:relative;
    width:78px;
    height:100px;
    z-index:3;
    filter:
        drop-shadow(0 0 7px #ff1744)
        drop-shadow(0 0 18px #ff1744)
        drop-shadow(0 0 35px rgba(255,0,51,.7));
    animation:flameMove 1.25s ease-in-out infinite;
}

.flame-main{
    position:absolute;
    width:68px;
    height:91px;
    left:5px;
    top:5px;

    background:
        linear-gradient(
            155deg,
            #fff5bd 0%,
            #ffd54a 18%,
            #ff8a00 43%,
            #ff1744 70%,
            #b9002d 100%
        );

    clip-path:
        polygon(
            50% 0%,
            63% 18%,
            60% 31%,
            82% 18%,
            78% 42%,
            100% 58%,
            82% 62%,
            89% 83%,
            67% 76%,
            58% 100%,
            39% 83%,
            20% 94%,
            25% 72%,
            0% 61%,
            20% 47%,
            12% 29%,
            36% 39%
        );

    animation:flameShape 1.1s ease-in-out infinite alternate;
}

.flame-inner{
    position:absolute;
    width:36px;
    height:54px;
    left:21px;
    top:38px;

    background:
        linear-gradient(
            180deg,
            #fffde7,
            #ffe082,
            #ff8a00
        );

    clip-path:
        polygon(
            50% 0%,
            72% 25%,
            65% 42%,
            94% 57%,
            72% 61%,
            80% 82%,
            53% 100%,
            29% 79%,
            6% 61%,
            31% 42%,
            26% 22%
        );

    filter:
        drop-shadow(0 0 8px #ffd54a);
}

@keyframes flameMove{
    0%,100%{
        transform:
            translateY(0)
            scale(1)
            rotate(-2deg);
    }

    50%{
        transform:
            translateY(-7px)
            scale(1.08)
            rotate(3deg);
    }
}

@keyframes flameShape{
    from{
        transform:skewX(-3deg) scaleY(.97);
    }

    to{
        transform:skewX(4deg) scaleY(1.04);
    }
}

/* Flying sparks around flame */
.spark{
    position:absolute;
    width:4px;
    height:8px;
    border-radius:50%;
    background:#ffb300;
    box-shadow:
        0 0 7px #ff6d00,
        0 0 15px #ff1744;
    opacity:0;
}

.spark.s1{
    left:28px;
    top:35px;
    animation:spark1 1.7s infinite;
}

.spark.s2{
    right:28px;
    top:55px;
    animation:spark2 1.4s .4s infinite;
}

.spark.s3{
    left:43px;
    top:15px;
    animation:spark3 1.8s .7s infinite;
}

.spark.s4{
    right:39px;
    top:80px;
    animation:spark2 1.5s 1s infinite;
}

@keyframes spark1{
    0%{
        transform:translate(0,0) scale(.3);
        opacity:0;
    }
    30%{
        opacity:1;
    }
    100%{
        transform:translate(-35px,-55px) scale(0);
        opacity:0;
    }
}

@keyframes spark2{
    0%{
        transform:translate(0,0) scale(.3);
        opacity:0;
    }
    30%{
        opacity:1;
    }
    100%{
        transform:translate(35px,-48px) scale(0);
        opacity:0;
    }
}

@keyframes spark3{
    0%{
        transform:translate(0,0) scale(.3);
        opacity:0;
    }
    30%{
        opacity:1;
    }
    100%{
        transform:translate(8px,-50px) scale(0);
        opacity:0;
    }
}

/* =====================================================
   TITLE
===================================================== */

.title{
    text-align:center;
    font-size:clamp(28px,7vw,40px);
    font-weight:900;
    letter-spacing:2px;
    line-height:1.15;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #ff8297,
            #ff1744,
            #ffffff,
            #ff1744
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:titleShine 4s linear infinite;

    text-shadow:
        0 0 20px rgba(255,23,68,.15);
}

@keyframes titleShine{
    to{
        background-position:300% center;
    }
}

.subtitle{
    text-align:center;
    color:#777781;
    font-size:9px;
    letter-spacing:2.5px;
    margin-top:9px;
    margin-bottom:29px;
}

/* =====================================================
   KEY
===================================================== */

.key-label{
    color:#6e6e77;
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.key-box{
    display:flex;
    align-items:center;
    gap:12px;
    min-height:66px;
    padding:12px;
    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            rgba(255,23,68,.055),
            rgba(0,0,0,.5)
        );

    border:1px solid rgba(255,23,68,.3);

    box-shadow:
        inset 0 0 25px rgba(255,23,68,.035),
        0 0 20px rgba(0,0,0,.35);

    transition:.3s ease;
}

.key-box:hover{
    transform:translateY(-3px);
    border-color:rgba(255,23,68,.75);
    box-shadow:
        0 0 25px rgba(255,23,68,.13),
        inset 0 0 25px rgba(255,23,68,.07);
}

.key-icon{
    width:40px;
    height:40px;
    flex:0 0 40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            rgba(255,23,68,.2),
            rgba(255,23,68,.04)
        );

    border:1px solid rgba(255,23,68,.35);

    color:#ff526f;
    font-size:17px;

    box-shadow:
        0 0 18px rgba(255,23,68,.1);

    animation:keyPulse 2s infinite;
}

@keyframes keyPulse{
    50%{
        box-shadow:
            0 0 25px rgba(255,23,68,.3);
    }
}

#keyText{
    color:#ededf0;
    font-size:10px;
    line-height:1.5;
    word-break:break-all;
    user-select:all;
}

/* =====================================================
   BUTTON
===================================================== */

.copy-btn{
    position:relative;
    width:100%;
    height:61px;
    margin-top:15px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:17px;

    cursor:pointer;
    overflow:hidden;

    font-family:"Orbitron",sans-serif;
    font-size:13px;
    font-weight:900;
    letter-spacing:2px;
    color:white;

    background:
        linear-gradient(
            135deg,
            #ff1744,
            #d50036 55%,
            #9d0029
        );

    box-shadow:
        0 12px 30px rgba(255,23,68,.25),
        inset 0 1px rgba(255,255,255,.25);

    transition:.25s ease;
}

.copy-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.5),
            transparent
        );

    transform:skewX(-25deg);
    animation:buttonShine 2.6s infinite;
}

.copy-btn::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    box-shadow:
        inset 0 0 25px rgba(255,255,255,.08);
    pointer-events:none;
}

@keyframes buttonShine{
    0%,30%{
        left:-120%;
    }

    70%,100%{
        left:140%;
    }
}

.copy-btn:hover{
    transform:
        translateY(-5px)
        scale(1.015);

    box-shadow:
        0 18px 45px rgba(255,23,68,.4),
        0 0 35px rgba(255,23,68,.15);
}

.copy-btn:active{
    transform:scale(.96);
}

.status{
    height:19px;
    margin-top:12px;
    text-align:center;
    color:#55555e;
    font-size:9px;
    transition:.3s;
}

.status.success{
    color:#ff6680;
    text-shadow:
        0 0 10px rgba(255,23,68,.8);
}

.footer{
    text-align:center;
    margin-top:6px;
    color:#414149;
    font-size:8px;
    letter-spacing:2px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

    .wrapper{
        width:92%;
    }

    .card{
        padding:30px 20px 25px;
    }

    .logo-area{
        width:135px;
        height:135px;
    }

    .flame{
        transform:scale(.9);
    }

    .title{
        font-size:28px;
    }

    #keyText{
        font-size:9px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="background">
    <div class="grid"></div>
    <div class="energy"></div>
    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="vignette"></div>
</div>

<!-- PARTICLES -->
<div class="particles" id="particles"></div>

<!-- MAIN -->
<main class="wrapper">

<section class="card">

    <!-- FLAME LOGO -->
    <div class="logo-area">

        <div class="ring one"></div>
        <div class="ring two"></div>
        <div class="ring three"></div>

        <div class="flame-glow"></div>

        <div class="flame">

            <div class="flame-main"></div>
            <div class="flame-inner"></div>

        </div>

        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="spark s3"></span>
        <span class="spark s4"></span>

    </div>

    <!-- TITLE -->
    <h1 class="title">
        Chilli Hub Key
    </h1>

    <p class="subtitle">
        KEY SYSTEM • ACCESS READY
    </p>

    <!-- KEY -->
    <div class="key-label">
        YOUR KEY
    </div>

    <div class="key-box">

        <div class="key-icon">
            🔑
        </div>

        <div id="keyText">
            ChilliHubKeyHdiehBskaowoejVdjsowieBdkaowiJsjwowop
        </div>

    </div>

    <!-- COPY -->
    <button class="copy-btn" id="copyBtn">
        COPY KEY
    </button>

    <div class="status" id="status"></div>

    <div class="footer">
        CHILLI HUB • KEY SYSTEM
    </div>

</section>

</main>

<script>

/* =====================================================
   KEY
===================================================== */

const key =
"ChilliHubKeyHdiehBskaowoejVdjsowieBdkaowiJsjwowop";

const copyBtn =
document.getElementById("copyBtn");

const status =
document.getElementById("status");


/* =====================================================
   COPY FUNCTION
===================================================== */

async function copyKey(){

    try{

        await navigator.clipboard.writeText(key);

        copyBtn.textContent =
        "✓ KEY COPIED!";

        status.textContent =
        "Key đã được sao chép thành công!";

        status.classList.add("success");

    }catch(error){

        const textarea =
        document.createElement("textarea");

        textarea.value = key;

        textarea.style.position =
        "fixed";

        textarea.style.left =
        "-9999px";

        document.body.appendChild(
            textarea
        );

        textarea.focus();
        textarea.select();

        try{

            document.execCommand("copy");

            copyBtn.textContent =
            "✓ KEY COPIED!";

            status.textContent =
            "Key đã được sao chép thành công!";

            status.classList.add(
                "success"
            );

        }catch(err){

            status.textContent =
            "Không thể sao chép key.";

        }

        textarea.remove();
    }

    setTimeout(()=>{

        copyBtn.textContent =
        "COPY KEY";

        status.textContent =
        "";

        status.classList.remove(
            "success"
        );

    },2500);
}

copyBtn.addEventListener(
    "click",
    copyKey
);


/* =====================================================
   RANDOM PARTICLES
===================================================== */

const particleBox =
document.getElementById(
    "particles"
);

for(let i=0;i<35;i++){

    const p =
    document.createElement(
        "span"
    );

    p.className =
    "particle";

    p.style.left =
    Math.random()*100+"%";

    p.style.animationDuration =
    (5+Math.random()*9)+"s";

    p.style.animationDelay =
    (Math.random()*8)+"s";

    const size =
    1+Math.random()*3;

    p.style.width =
    size+"px";

    p.style.height =
    size+"px";

    particleBox.appendChild(p);
}

</script>

</body>
</html>
